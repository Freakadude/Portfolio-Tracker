name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy folio
      # in parallel, one worker per core; the timing test runs alone afterwards, because a loaded
      # machine would skew the 300 ms it measures
      - run: uv run pytest -n auto --ignore=tests/perf --cov=folio --cov-report=term-missing
      - run: uv run pytest tests/perf --cov=folio --cov-append --cov-report=term-missing
      - name: Coverage gate for domain, analytics and strategies (at least 85 percent)
        run: uv run coverage report --include="folio/domain/*,folio/analytics/*,folio/strategies/*,folio/lookthrough/*,folio/news/*,folio/agent/cost.py,folio/agent/budget.py,folio/agent/prompt_files.py,folio/agent/validate.py,folio/agent/outcomes.py,folio/agent/answers.py,folio/security/totp.py" --fail-under=85
      - run: uv run pip-audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a hung step must fail, not sit for hours
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The unit tests have hung on these runners now and then, never on a developer machine. A
      # hang is cut off after 7 minutes and Node's diagnostic report says what the stuck process
      # was running.
      - name: Unit tests
        run: |
          export NODE_OPTIONS="--report-on-signal --report-signal=SIGUSR2 --report-directory=$RUNNER_TEMP/node-reports"
          npm test -- --pool=forks --reporter=verbose &
          pid=$!
          for _ in $(seq 1 84); do kill -0 "$pid" 2>/dev/null || break; sleep 5; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::the unit tests hung; the stuck processes are listed below"
            pkill -USR2 -x node || true
            sleep 10
            shopt -s nullglob
            for f in "$RUNNER_TEMP"/node-reports/*.json; do
              echo "=== $f"
              node -e 'const r = require(process.argv[1]); console.log(r.header.commandLine.join(" ").slice(0, 200)); console.log(r.javascriptStack.message); console.log((r.javascriptStack.stack || []).slice(0, 30).join(String.fromCharCode(10)))' "$f" || true
            done
            kill -9 "$pid" || true
            exit 1
          fi
          wait "$pid"
      - run: npm audit --audit-level=high
      - name: API schema is up to date
        run: |
          uv sync --frozen --project ..
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts openapi.json
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build multi-arch image (not pushed)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: FOLIO_VERSION=${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    # Only a green main publishes. The image is what Portainer pulls (docs/deployment.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web, image, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry names are lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push the multi-arch image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: FOLIO_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
