# Deploy as a Portainer stack on the Docker LXC (see docs/deployment.md). Reach it over the LAN
# or Tailscale only; never put it behind a publicly exposed reverse proxy.
#
# The image is built and published by CI on every green push to main. To build it here instead,
# add the override: docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Settings come from the stack's environment variables (Portainer's "Environment variables"
# panel, or a .env file next to this file). A variable left empty is not passed on.
x-folio-env: &folio-env
  FOLIO_SECRET_KEY: ${FOLIO_SECRET_KEY:?set FOLIO_SECRET_KEY (uv run folio init makes one)}
  FOLIO_BASE_URL: # the address links in notifications open, e.g. http://192.168.1.10:8555
  FOLIO_TZ:
  FOLIO_LOG_LEVEL:
  FOLIO_EXTRA_BACKUP_DIR:

services:
  web:
    image: ${FOLIO_IMAGE:-ghcr.io/freakadude/portfolio-tracker:latest}
    pull_policy: always
    command: ["web"]
    init: true
    environment: *folio-env
    volumes: ["folio-data:/data"]
    ports: ["${FOLIO_LAN_IP:?set FOLIO_LAN_IP}:${FOLIO_WEB_PORT:-8555}:8080"] # LAN interface only; the app listens on 8080 inside the container
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-m", "folio.healthcheck", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    image: ${FOLIO_IMAGE:-ghcr.io/freakadude/portfolio-tracker:latest}
    pull_policy: always
    command: ["worker"]
    init: true
    environment: *folio-env
    volumes: ["folio-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    depends_on:
      web: { condition: service_healthy } # web runs migrations on start
    restart: unless-stopped
  ntfy:
    image: binwiederhier/ntfy
    command: ["serve"]
    profiles: ["ntfy"]
    volumes: ["ntfy-data:/var/lib/ntfy"]
    ports: ["${FOLIO_LAN_IP:?set FOLIO_LAN_IP}:8081:80"]
    restart: unless-stopped
volumes:
  folio-data: {}
  ntfy-data: {}
