[project]
name = "folio"
version = "0.1.0"
description = "Folio: self-hosted personal portfolio manager"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "segno>=1.6.1",
    "sqlalchemy>=2.1.3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
folio = "folio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["folio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "folio.domain.*",
    "folio.analytics.*",
    "folio.security.*",
    "folio.db.*",
    "folio.strategies.*",
    "folio.lookthrough.*",
    "folio.news.*",
    "folio.agent.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: the 10 years x 50 instruments performance test (NFR-03); runs in CI"]
